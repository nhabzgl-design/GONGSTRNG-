<script>
// BOSS FIX Nov 9: Isang beses lang (bawat archive) - ibalik sa live list ang mga lumang araw na naka-archive
// para lumabas sa CALENDAR. Hindi na mauulit pag na-merge na. Pag nag-CLEAR ALL DATA, buburahin pati archive at flag.
(function(){
  try{
    var MAP={'jobs':'g-jobs','motos':'g-motos','sales':'g-sales','jobPayments':'g-job-payments','customers':'g-customers','receipts':'g-receipts'};
    function getArr(k){ try{ var v=JSON.parse(localStorage.getItem(k)||'[]'); return Array.isArray(v)?v:[]; }catch(e){ return []; } }
    function keyOf(o){ return String(o && (o.id || (o.date+'|'+(o.customer||'')+'|'+(o.service||o.name||'')+'|'+(o.amount||o.total||o.labor||'')))); }
    var done=getArr('g-merged-dates'), dates=[];
    for(var i=0;i<localStorage.length;i++){ var k=localStorage.key(i); if(k && /^g-history-\d{4}-\d{2}-\d{2}$/.test(k)){ var d=k.slice(10); if(done.indexOf(d)===-1) dates.push(d); } }
    if(!dates.length) return;
    var live={}, seen={}; Object.keys(MAP).forEach(function(f){ live[f]=getArr(MAP[f]); seen[f]={}; live[f].forEach(function(o){ seen[f][keyOf(o)]=1; }); });
    var added=0;
    dates.forEach(function(d){
      var arch=null; try{ arch=JSON.parse(localStorage.getItem('g-history-'+d)||'null'); }catch(e){}
      if(arch && !Array.isArray(arch)){
        Object.keys(MAP).forEach(function(f){
          var arr=arch[f]; if(!Array.isArray(arr)) return;
          arr.forEach(function(o){ if(!o) return; var kk=keyOf(o); if(!seen[f][kk]){ seen[f][kk]=1; live[f].push(o); added++; } });
        });
      }
      done.push(d);
    });
    if(added>0){ Object.keys(MAP).forEach(function(f){ localStorage.setItem(MAP[f], JSON.stringify(live[f])); }); }
    localStorage.setItem('g-merged-dates', JSON.stringify(done));
    console.log('BOSS: ibinalik '+added+' archived items sa live list');
  }catch(e){ console.log('merge error',e); }
})();
</script>


<script>
window._bossNormalize = function(s){
  if(!s) return "";
  try{
    let map = {};
    let ranges = [
      {s:0x1D400, b:65, l:26}, {s:0x1D41A, b:97, l:26},
      {s:0x1D434, b:65, l:26}, {s:0x1D44E, b:97, l:26},
      {s:0x1D468, b:65, l:26}, {s:0x1D482, b:97, l:26},
      {s:0x1D49C, b:65, l:26}, {s:0x1D4B6, b:97, l:26},
      {s:0x1D5A0, b:65, l:26}, {s:0x1D5BA, b:97, l:26},
      {s:0x1D63C, b:65, l:26}, {s:0x1D656, b:97, l:26},
      {s:0x1D670, b:65, l:26}, {s:0x1D68A, b:97, l:26},
      {s:0xFF21, b:65, l:26}, {s:0xFF41, b:97, l:26}
    ];
    ranges.forEach(r=>{
      for(let i=0;i<r.l;i++){
        let fc = String.fromCodePoint(r.s+i);
        let nc = String.fromCharCode(r.b+i);
        map[fc]=nc;
      }
    });
    let res="";
    for(let ch of s){
      res += map[ch] || ch;
    }
    return res.normalize('NFKD').replace(/[\u0300-\u036f]/g,'');
  }catch(e){ return s; }
};
</script>
